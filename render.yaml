services:
  - type: web
    name: cru-bank-demo
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /login
    disk:
      name: cru-bank-private-files
      mountPath: /opt/render/project/src/instance
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: COOKIE_SECURE
        value: "true"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cru-bank-db
          property: connectionString
      - key: DOCUMENT_ENCRYPTION_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: cru-bank-db
    plan: basic-256mb
    databaseName: cru_bank
    user: cru_bank_user
